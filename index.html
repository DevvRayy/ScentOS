<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)" />
  <meta name="description" content="SCENTOS — Personal Fragrance Intelligence. Kelola koleksi parfum offline-first." />
  <title>SCENTOS — Personal Fragrance Intelligence</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="app">
    <!-- ========== HEADER ========== -->
    <header class="app-header">
      <div class="app-header__brand">
        <span class="app-header__logo" aria-hidden="true">◈</span>
        <div class="app-header__text">
          <h1 class="app-header__title">SCENTOS</h1>
          <p class="app-header__subtitle">Personal Fragrance Intelligence</p>
        </div>
      </div>
      <button
        type="button"
        class="btn btn--primary btn--icon"
        data-action="open-add"
        aria-label="Tambah parfum baru"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </header>

    <!-- ========== TOOLBAR ========== -->
    <section class="toolbar" aria-label="Pencarian dan filter">
      <div class="field field--search">
        <label for="search-input" class="sr-only">Cari parfum berdasarkan nama atau brand</label>
        <span class="field__search-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </span>
        <input
          id="search-input"
          type="search"
          class="field__input"
          placeholder="Cari nama atau brand…"
          autocomplete="off"
          inputmode="search"
        />
      </div>
      <div class="toolbar__row">
        <select
          id="filter-brand"
          class="select"
          aria-label="Filter brand"
        >
          <option value="all">Semua Brand</option>
        </select>
        <span id="count-badge" class="badge" aria-live="polite">0 parfum</span>
      </div>
    </section>

    <!-- ========== MAIN ========== -->
    <main id="main" class="main" aria-live="polite" aria-atomic="false">
      <!-- Dirender oleh state.js -->
    </main>

    <!-- ========== BOTTOM NAV ========== -->
    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button type="button" class="nav__item nav__item--active" aria-current="page" aria-label="Inventory — aktif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3" />
          <rect x="3" y="8" width="18" height="13" rx="2" />
          <line x1="9" y1="8" x2="9" y2="21" />
        </svg>
        <span>Inventory</span>
      </button>

      <button type="button" class="nav__item" disabled aria-disabled="true" aria-label="Journal — segera hadir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <span>Journal</span>
        <span class="nav__badge" aria-hidden="true">Soon</span>
      </button>

      <button type="button" class="nav__item" disabled aria-disabled="true" aria-label="DNA — segera hadir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 3c0 6 10 12 10 18" />
          <path d="M17 3c0 6-10 12-10 18" />
          <line x1="8" y1="8" x2="16" y2="8" />
          <line x1="8" y1="16" x2="16" y2="16" />
        </svg>
        <span>DNA</span>
        <span class="nav__badge" aria-hidden="true">Soon</span>
      </button>

      <button type="button" class="nav__item" disabled aria-disabled="true" aria-label="Layering — segera hadir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
        <span>Layering</span>
        <span class="nav__badge" aria-hidden="true">Soon</span>
      </button>

      <button type="button" class="nav__item" disabled aria-disabled="true" aria-label="Finance — segera hadir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="1" x2="12" y2="23" />
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
        <span>Finance</span>
        <span class="nav__badge" aria-hidden="true">Soon</span>
      </button>
    </nav>
  </div>

  <!-- Root untuk modal & toast -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

  <!-- Scripts — order matters -->
  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
